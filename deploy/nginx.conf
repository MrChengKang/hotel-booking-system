worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    # The external HTTPS terminator must replace client-supplied forwarded headers.
    # Compose binds the frontend to host loopback; the backend has no public port.
    map $http_x_forwarded_proto $stay_proto {
        default $scheme;
        https https;
    }
    map $stay_proto $stay_port {
        default $server_port;
        https 443;
    }
    log_format stay '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout stay;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 6m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }
        location /api/ {
            # No URI suffix: keep /api/ when forwarding to Spring Boot.
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $stay_proto;
            proxy_set_header X-Forwarded-Port $stay_port;
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_intercept_errors off;
        }
        location = /api { return 404; }
        location /static/ {
            try_files $uri =404;
            expires 1y;
        }
        location = /index.html { expires -1; }
        location ~ /\. { return 404; }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
