# Optional host Nginx example for a VM. Replace the domain and certificate paths.
# A hosting platform with its own HTTPS ingress can provide this function instead.
server {
    listen 80;
    server_name stay.example.com;
    return 301 https://stay.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name stay.example.com;
    ssl_certificate /etc/letsencrypt/live/stay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stay.example.com/privkey.pem;
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        # Replace client-provided forwarding headers at this trusted boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 60s;
    }
}
