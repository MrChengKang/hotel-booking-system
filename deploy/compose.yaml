name: stay
services:
  backend:
    build:
      context: ${STAY_BACKEND_CONTEXT:-../../hotel-booking}
    env_file:
      - path: ${STAY_BACKEND_ENV_FILE:-./production.env}
        format: raw
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: '8080'
      STAY_MEDIA_DIRECTORY: /var/lib/stay/hotel-images
    expose:
      - '8080'
    volumes:
      - stay-media:/var/lib/stay
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  frontend:
    build:
      context: ..
      args:
        REACT_APP_API_URL: /api
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:8080'
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  stay-media:
